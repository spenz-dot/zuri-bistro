{% extends "menu/base.html" %}
{% block title %}Book a Table{% endblock %}
{% block content %}
  <h2>Book a Table</h2>
  {% if request.GET.sent %}
    <p><strong>Thank you! Your booking request has been received.</strong></p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Reserve</button>
  </form>
{% endblock %}
